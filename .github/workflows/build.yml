name: Build NukeAccount Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build plugin
      run: ./gradlew assembleRelease
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NukeAccount-plugin
        path: build/outputs/aar/release/
        retention-days: 30
